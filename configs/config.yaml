# =============================================================================
# configs/config.yaml
# Regional Landslide Risk & Emergency Response Decision System (SIH26001)
# Blueprint v2.0 — Milestone M0
# =============================================================================
# All configurable parameters live here. Scripts read this file and must
# NOT hard-code any value that appears here.
# Update after Data Reconnaissance (Phase 0.5) before proceeding to Phase 1.
# =============================================================================

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seed: 42

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
project:
  name: "LEWDSS — Landslide Early-Warning Decision Support System"
  id: "SIH26001"
  blueprint_version: "2.0"
  milestone: "M0"
  advisory_disclaimer: >
    This output is generated by a research prototype trained on historical
    catalog data. It is NOT an operationally validated prediction. Model
    probabilities do not represent calibrated real-world probabilities of
    landslide occurrence. All decisions must be made by qualified human
    authorities based on official guidelines.

# ---------------------------------------------------------------------------
# Geographic regions
# ---------------------------------------------------------------------------
regions:
  region_a:
    name: "Western Ghats"
    states: ["Karnataka", "Kerala", "Maharashtra"]
    bounding_box:
      # [min_lon, min_lat, max_lon, max_lat] — WGS84 / EPSG:4326
      # Approximate; refine after reconnaissance
      min_lon: 73.5
      min_lat: 8.5
      max_lon: 77.5
      max_lat: 18.5
    candidate_districts:
      - "Kodagu"
      - "Wayanad"
      - "Idukki"
      - "Ratnagiri"
      - "Kollam"
    utm_zone: "EPSG:32643"  # UTM Zone 43N

  region_b:
    name: "Northeast India (Sikkim + Meghalaya)"
    states: ["Sikkim", "Meghalaya"]
    bounding_box:
      min_lon: 88.0
      min_lat: 24.5
      max_lon: 93.0
      max_lat: 28.5
    candidate_districts:
      - "East Sikkim"
      - "West Sikkim"
      - "East Khasi Hills"
      - "Ri Bhoi"
    utm_zone: "EPSG:32645"  # UTM Zone 45N

# ---------------------------------------------------------------------------
# Data sources — candidate only; verified = false until reconnaissance confirms
# ---------------------------------------------------------------------------
data_sources:

  dem:
    primary:
      name: "Copernicus DEM GLO-30"
      url_template: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{tile}_DEM/Copernicus_DSM_COG_10_{tile}_DEM.tif"
      resolution_m: 30
      license: "CC-BY-4.0"
      access: "open_https_aws_s3"
      verified: true
      expected_size_per_tile_mb: 42
    fallback:
      name: "SRTM 30m"
      url: "https://earthdata.nasa.gov/eosdis/daacs/lpdaac"
      resolution_m: 30
      access: "earthdata_login_required"
      verified: false
      note: "Deprecated in favor of Copernicus GLO-30 due to mountain void artifacts"

  rainfall:
    primary:
      name: "CHIRPS v2.0"
      base_url: "https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_daily/tifs/p05/{year}/chirps-v2.0.{year}.{month}.{day}.tif.gz"
      resolution_deg: 0.05
      temporal_coverage: "1981-01-01 to present"
      format: "GeoTIFF (.tif.gz)"
      license: "open — no restrictions"
      access: "open_http"
      verified: true
      expected_size_per_file_mb: 3.0
    fallback:
      name: "NASA GPM IMERG Final"
      url: "https://gpm.nasa.gov/data/imerg"
      temporal_coverage: "2000-06-01 to present"
      access: "earthdata_login_required"
      verified: false

  landslide_events:
    primary:
      name: "NASA GLC / UGLC (Unified Global Landslide Catalogue, ESSD 2024)"
      url: "https://landslides.nasa.gov"
      format: "CSV / GeoPackage"
      license: "open — CC-BY-4.0 / NASA public domain"
      access: "open_zenodo"
      verified: true
      india_event_count: 28043
      date_precision: "100.0% day-level in target districts (254/254 events)"
      target_district_counts:
        region_a:
          wayanad: 33
          idukki: 69
          kodagu: 28
          total: 130
        region_b:
          east_sikkim: 49
          west_sikkim: 25
          east_khasi_hills: 50
          total: 124
    supplementary:
      name: "ISRO Bhuvan Landslide Atlas (NRSC 2023)"
      url: "https://bhuvan.nrsc.gov.in"
      format: "Published Atlas Report / WMS Services"
      access: "reference_only"
      verified: false
      india_event_count: "~80,000 nationwide (report reference; raw shapefiles restricted)"

  soil_moisture:
    tier_1:
      name: "NASA SMAP L3 Daily Composite (SPL3SMP)"
      url: "https://nsidc.org/data/spl3smp"
      resolution_km: 36
      temporal_coverage: "2015-04-01 to present"
      access: "earthdata_login_required"
      verified: false
      india_coverage_fraction: "UNKNOWN"
    tier_2_a:
      name: "GLEAM v3"
      url: "https://www.gleam.eu/"
      resolution_deg: 0.25
      temporal_coverage: "1980-01-01 to present"
      access: "registration_required"
      verified: false
    tier_2_b:
      name: "GLDAS-2.1 Noah"
      url: "https://disc.gsfc.nasa.gov/datasets/GLDAS_NOAH025_3H_2.1"
      resolution_deg: 0.25
      access: "earthdata_login_required"
      verified: false
    tier_3:
      name: "ISRIC SoilGrids 250m / HWSD v2 + TWI composite"
      soilgrids_url: "https://files.isric.org/soilgrids/latest/data/clay/"
      access: "open"
      verified: true
      note: "Static spatial proxy only — does not vary across time. Strictly fallback."

  soil_texture:
    name: "ISRIC SoilGrids 250m / HWSD v2"
    url: "https://files.isric.org/soilgrids/latest/data/clay/"
    resolution_m: 250
    license: "CC-BY-4.0"
    access: "open"
    verified: true

  lulc:
    name: "ISRO Bhuvan LULC 50K"
    url: "https://bhuvan.nrsc.gov.in/bhuvan_links.php"
    format: "Shapefile"
    access: "portal"
    verified: false

  geology:
    name: "GSI Bhukosh Geological Map"
    url: "https://bhukosh.gsi.gov.in/"
    format: "Shapefile"
    access: "portal"
    license: "GSI DSAP (academic derivative works permitted with mandatory attribution)"
    verified: true
    mandatory_attribution: "Product of Geological Survey of India; reproduced by permission of Director General on behalf of Government of India."

  rainfall_forecast:
    name: "NOAA GFS (for DLM forward projection)"
    url: "https://nomads.ncep.noaa.gov/"
    resolution_deg: 0.25
    forecast_days: 3
    verified: false
    dlm_mode: "Simulated Scenario (historical monsoon percentiles)"
    format: "GRIB2"
    access: "open"
    verified: false
    note: >
      Required for DLM 'Forecast' label. If unavailable, dashboard uses
      'Simulated Scenario' label with historical percentile rainfall.

  district_boundaries:
    name: "India District Boundaries"
    primary_url: "https://github.com/datameet/maps"
    fallback_url: "https://geodata.lib.utexas.edu/"
    format: "GeoJSON / Shapefile"
    access: "open"
    verified: false

# ---------------------------------------------------------------------------
# Preprocessing parameters (provisional — update after reconnaissance)
# ---------------------------------------------------------------------------
preprocessing:
  target_crs: "EPSG:4326"
  dem_nodata_value: -9999
  negative_sample_ratio: 3          # events:non-events = 1:3
  min_spatial_gap_km: 5             # min km between positive and negative samples
  max_missing_fraction: 0.20        # reject feature column if > 20% missing
  monsoon_months: [6, 7, 8, 9]     # June–September (for negative sample restriction)
  antecedent_windows_days: [3, 7, 15]
  min_dlm_history_days: 15

# ---------------------------------------------------------------------------
# Soil moisture tier selection (provisional)
# ---------------------------------------------------------------------------
soil_moisture:
  preferred_tier: 1
  tier_1_min_coverage_fraction: 0.60   # Use Tier 1 if covers >= 60% of event dates
  tier_flag_column: "sm_tier"

# ---------------------------------------------------------------------------
# Advisory banding thresholds (provisional — do not use for operational decisions)
# ---------------------------------------------------------------------------
advisory:
  bands:
    low:      { min: 0.00, max: 0.30, colour: "green",  label: "LOW" }
    moderate: { min: 0.30, max: 0.55, colour: "yellow", label: "MODERATE" }
    high:     { min: 0.55, max: 0.75, colour: "orange", label: "HIGH" }
    very_high: { min: 0.75, max: 1.00, colour: "red",    label: "VERY HIGH" }
  dlm_rising_trend_window_days: 5   # Rising trend indicator if monotone increase over N days

# ---------------------------------------------------------------------------
# Acceptance criteria (provisional — update after reconnaissance)
# ---------------------------------------------------------------------------
acceptance_criteria:
  feature_coverage_min: 0.90
  max_missing_fraction: 0.20
  min_events_per_region: 30          # Absolute minimum for any spatial CV
  event_date_precision_min: 0.80     # Fraction with day-level precision
  shap_top3_coverage_min: 0.60
  shap_dynamic_feature_in_top3_min: 0.70
  api_response_time_sec: 5.0
  test_coverage_min: 0.80

# ---------------------------------------------------------------------------
# Model hyperparameter search spaces (Phase 3+)
# ---------------------------------------------------------------------------
logistic_regression:
  solver: "lbfgs"
  max_iter: 1000
  class_weight: "balanced"
  C_grid: [0.001, 0.01, 0.1, 1.0, 10.0]

random_forest:
  class_weight: "balanced_subsample"
  n_estimators_grid: [100, 200, 500]
  max_depth_grid: [null, 10, 20]
  min_samples_leaf_grid: [1, 5, 10]
  n_iter_random_search: 20

# ---------------------------------------------------------------------------
# Paths (relative to project root)
# ---------------------------------------------------------------------------
paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_processed: "data/processed"
  models: "models"
  reports: "reports"
  logs: "reports/logs"
