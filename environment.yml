# =============================================================================
# environment.yml — Conda environment specification
# Regional Landslide Risk & Emergency Response Decision System (SIH26001)
# Blueprint v2.0 — Milestone M0
# =============================================================================
# NOTE: conda is not required. This file is provided for reproducibility
# documentation. If you have conda, run:
#     conda env create -f environment.yml
#     conda activate lewdss
#
# Without conda, use pip:
#     pip install -r requirements.txt
# =============================================================================

name: lewdss
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core data science
  - numpy>=1.26
  - pandas>=2.1
  - requests>=2.31
  - tqdm>=4.66

  # Notebooks
  - jupyter>=1.0
  - ipykernel>=6.29
  - matplotlib>=3.8
  - seaborn>=0.13

  # Testing
  - pytest>=8.0
  - pytest-cov>=5.0

  # Utilities
  - pyyaml>=6.0
  - python-dotenv>=1.0

  # pip-only packages (not on conda-forge)
  - pip:
      - requests>=2.31

